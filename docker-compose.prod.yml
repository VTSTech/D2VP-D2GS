# Public-facing production realm: PvPGN (bnetd, d2cs, d2dbs) + D2GS.
#
#   cp .env.prod.example .env.prod    # set PUBLIC_IP and secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Requirements: an x86_64 host. D2GS.exe is a 32-bit Windows binary run under
# Wine and the image installs wine32:i386, which does not exist for ARM64.
# See docs/PUBLIC-DEPLOYMENT.md for the Raspberry Pi split-host topology.
#
# Differs from docker-compose.yml (dev) by: restart always, log rotation,
# a persistent game-directory volume, and no LAN-only shortcuts.

name: d2vp-realm

x-pvpgn: &pvpgn
  image: pvpgn:1.99.8
  # Pin to a local checkout for reproducible builds:
  #   PVPGN_BUILD_CONTEXT=/srv/pvpgn
  build: ${PVPGN_BUILD_CONTEXT:-https://github.com/espenmjos/pvpgn.git}
  restart: always
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  volumes:
    - pvpgn-etc:/usr/local/etc/pvpgn
    - pvpgn-var:/usr/local/var/pvpgn

x-translation: &translation
  # Address clients are told to use for the realm and the game server.
  PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env.prod}
  LAN_IP: ${LAN_IP:-}
  LAN_NETWORK: ${LAN_NETWORK:-}
  TRANSLATE: 172.30.0.11:6113 172.30.0.20:4000

services:
  bnetd:
    <<: *pvpgn
    command: bnetd
    environment:
      <<: *translation
      REALM_NAME: ${REALM_NAME:-D2CS}
      REALM_DESCRIPTION: ${REALM_DESCRIPTION:-D2VP Closed Realm}
      D2CS_ADDR: 172.30.0.11:6113
    ports:
      - "6112:6112"
      - "6112:6112/udp"
    networks:
      realm: { ipv4_address: 172.30.0.10 }

  d2cs:
    <<: *pvpgn
    command: d2cs
    environment:
      <<: *translation
      REALM_NAME: ${REALM_NAME:-D2CS}
      BNETD_ADDR: 172.30.0.10:6112
      D2GS_IPS: 172.30.0.20
      D2GS_PASSWORD: ${D2GS_PASSWORD:-}
    ports:
      - "6113:6113"        # clients join the realm here
    networks:
      realm: { ipv4_address: 172.30.0.11 }
    depends_on: [bnetd]

  d2dbs:
    <<: *pvpgn
    command: d2dbs
    environment:
      D2GS_IPS: 172.30.0.20
    networks:
      realm: { ipv4_address: 172.30.0.12 }
    depends_on: [bnetd]

  d2gs:
    build: .
    image: d2gs:1.14d
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      D2CS_IP: 172.30.0.11
      D2DBS_IP: 172.30.0.12
      D2CS_SECRET: ${D2GS_PASSWORD:-}
      MAX_GAMES: ${MAX_GAMES:-50}
      MAX_GAME_LIFE: ${MAX_GAME_LIFE:-14400}
      MOTD: ${MOTD:-Welcome to Diablo II!}
      # Admin console password hash. Default corresponds to "abcd123" - change it.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-9e75a42100e1b9e0b5d3873045084fae699adcb0}
      D2GS_DEBUG_NET_PACKET: ${D2GS_DEBUG_NET_PACKET:-0}
    ports:
      - "4000:4000"                 # game traffic (public)
      - "127.0.0.1:8888:8888"       # admin console: localhost only
    volumes:
      # Persistent game directory: keeps d2vp.ini, logs and future .sss pools.
      # Starts empty and is seeded from the image on first boot.
      - d2gs-work:/home/d2gs/.wine/drive_c/d2gs
    networks:
      realm: { ipv4_address: 172.30.0.20 }
    depends_on: [d2cs, d2dbs]

networks:
  realm:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pvpgn-etc:     # server configuration (edited in place)
  pvpgn-var:     # accounts, characters, ladders - BACK THIS UP
  d2gs-work:     # game files, d2vp.ini, logs, stash pools
